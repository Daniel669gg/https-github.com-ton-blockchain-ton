- id: GHOST-SOL-PDA-001
  name: Missing Canonical Bump
  description: PDA without stored canonical bump
  severity: HIGH
  cwe: CWE-20
  owasp: A01:2021
  languages:
  - rust
  confidence: 0.88
  patterns:
  - type: regex
    pattern: create_program_address\b(?!.*bump)
    confidence: 0.88
  fix: Store canonical bump via find_program_address
  tags:
  - solana
  - pda
  - bump
- id: GHOST-SOL-PDA-002
  name: PDA Seed from User Input
  description: PDA seeds include unvalidated user data
  severity: CRITICAL
  cwe: CWE-20
  owasp: A01:2021
  languages:
  - rust
  confidence: 0.9
  patterns:
  - type: regex
    pattern: seeds\s*=\s*\[\s*\w+\b(?!.*assert|.*require)
    confidence: 0.9
  fix: Validate user-supplied PDA seeds
  tags:
  - solana
  - pda
  - seed-injection
- id: GHOST-SOL-PDA-003
  name: PDA Not Re-derived
