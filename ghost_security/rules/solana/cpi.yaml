- id: GHOST-SOL-CPI-001
  name: Unchecked CPI Return
  description: CPI result not propagated
  severity: HIGH
  cwe: CWE-703
  owasp: A01:2021
  languages:
  - rust
  confidence: 0.88
  patterns:
  - type: regex
    pattern: invoke\s*\((?!.*\?)
    confidence: 0.88
  fix: Use ? operator to propagate CPI errors
  tags:
  - solana
  - cpi
  - error
