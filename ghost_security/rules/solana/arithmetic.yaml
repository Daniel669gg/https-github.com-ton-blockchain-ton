- id: GHOST-SOL-ARITH-001
  name: Missing checked_add
  description: Unchecked addition
  severity: HIGH
  cwe: CWE-190
  owasp: A01:2021
  languages:
  - rust
  confidence: 0.9
  patterns:
  - type: regex
    pattern: (?<!checked_)(?<!\.)(?:balance|amount|total)\s*\+=
    confidence: 0.9
  fix: Use checked_add() for u64 arithmetic
  tags:
  - solana
  - overflow
  - addition
- id: GHOST-SOL-ARITH-002
  name: Missing checked_mul
  description: Unchecked multiplication
  severity: HIGH
  cwe: CWE-190
  owasp: A01:2021
  languages:
  - rust
  confidence: 0.88
  patterns:
  - type: regex
    pattern: amount\s*\*\s*\w+(?!\.checked_mul)
    confidence: 0.88
  fix: Use checked_mul()
  tags:
  - solana
  - overflow
  - multiplication
- id: GHOST-SOL-ARITH-003
  name: Integer Truncation with as
  description: Casting larger int to smaller with as
  severity: HIGH
  cwe: CWE-197
  owasp: A01:2021
  languages:
  - rust
  confidence: 0.85
  patterns:
  - type: regex
    pattern: as\s+u(?:8|16|32)\b
    confidence: 0.85
  fix: Use try_from() instead of as
  tags:
  - solana
  - truncation
  - cast
- id: GHOST-SOL-ARITH-004
  name: Division By Zero
  description: Dividing by user value without check
  severity: HIGH
  cwe: CWE-369
  owasp: A01:2021
  languages:
  - rust
  confidence: 0.88
  patterns:
  - type: regex
