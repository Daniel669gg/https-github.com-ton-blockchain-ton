- id: GHOST-API-AUTH-001
  name: Missing API authentication
  description: API endpoint without auth check
  severity: HIGH
  cwe: CWE-306
  owasp: A01:2021
  languages:
  - python
  - javascript
  - typescript
  - go
  confidence: 0.77
  patterns:
