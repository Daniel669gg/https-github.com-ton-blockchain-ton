    pattern: '@(?:app|router)\.(?:get|post|put|delete)\s*\([^)]+\)(?!.*(?:auth|token|jwt|require)[\s\S]{0,100}@)'
    confidence: 0.77
  fix: Add authentication middleware
  tags:
