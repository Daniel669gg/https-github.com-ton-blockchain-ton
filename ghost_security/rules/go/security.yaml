- id: GHOST-GO-001
  name: SQL Injection in Go
  description: fmt.Sprintf used to build SQL query
  severity: CRITICAL
  cwe: CWE-89
  owasp: A01:2021
  languages:
  - go
  confidence: 0.92
  patterns:
  - type: regex
    pattern: fmt\.Sprintf\s*\(\s*".*SELECT|fmt\.Sprintf\s*\(\s*".*INSERT
    confidence: 0.92
  fix: Use database/sql parameterized queries
  tags:
  - go
  - sql-injection
