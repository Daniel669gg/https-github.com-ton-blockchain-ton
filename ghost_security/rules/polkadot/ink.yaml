- id: GHOST-INK-001
  name: Missing Constructor Access Control
  description: Constructor without caller check
  severity: HIGH
  cwe: CWE-284
  owasp: A01:2021
  languages:
  - rust
  confidence: 0.88
  patterns:
  - type: regex
    pattern: '#\[ink\(constructor\)\](?!.*caller|.*owner)'
    confidence: 0.88
  fix: Verify caller in constructor
  tags:
  - ink
  - access-control
  - constructor
- id: GHOST-INK-002
