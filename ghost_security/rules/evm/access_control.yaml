- id: GHOST-EVM-AC-001
  name: tx.origin Authentication
  description: Using tx.origin for auth is phishable
  severity: HIGH
  cwe: CWE-284
  owasp: A01:2021
  languages:
  - solidity
  confidence: 0.95
  patterns:
  - type: regex
    pattern: tx\.origin\s*==
    confidence: 0.95
  fix: Replace tx.origin with msg.sender
  tags:
  - access-control
  - tx-origin
  - phishing
- id: GHOST-EVM-AC-002
