- id: GHOST-EVM-MEV-001
  name: Missing Slippage Protection
  description: No slippage check in swap
  severity: HIGH
  cwe: CWE-20
  owasp: A01:2021
  languages:
  - solidity
  confidence: 0.88
  patterns:
  - type: regex
    pattern: swap\w*\([^)]*\)(?!.*amountOutMin|.*minAmount)
    confidence: 0.88
  fix: Add amountOutMin slippage parameter
  tags:
  - mev
  - slippage
  - dex
