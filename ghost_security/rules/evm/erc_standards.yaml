- id: GHOST-EVM-ERC-001
  name: ERC20 Approve Race Condition
  description: approve() without decreaseAllowance
  severity: HIGH
  cwe: CWE-362
  owasp: A01:2021
  languages:
  - solidity
  confidence: 0.88
  patterns:
  - type: regex
    pattern: function\s+approve\b(?!.*increaseAllowance|.*decreaseAllowance)
    confidence: 0.88
  fix: Use increaseAllowance/decreaseAllowance
  tags:
  - erc20
  - race-condition
  - approve
- id: GHOST-EVM-ERC-002
  name: Missing Return Value on Transfer
  description: ERC20 transfer return value ignored
  severity: HIGH
  cwe: CWE-252
  owasp: A01:2021
  languages:
  - solidity
  confidence: 0.9
  patterns:
  - type: regex
    pattern: \.transfer\s*\([^)]*\)(?!\s*;.*require|.*SafeERC20)
    confidence: 0.9
  fix: Use SafeERC20 library
  tags:
  - erc20
  - return-value
- id: GHOST-EVM-ERC-003
  name: ERC4626 Inflation Attack
  description: Vault shares manipulable with first deposit
  severity: CRITICAL
  cwe: CWE-20
  owasp: A01:2021
  languages:
  - solidity
  confidence: 0.88
  patterns:
  - type: regex
    pattern: ERC4626|deposit.*shares(?!.*_decimalsOffset|.*virtual)
    confidence: 0.88
  fix: Add virtual shares to prevent inflation attack
  tags:
  - erc4626
  - inflation
  - vault
