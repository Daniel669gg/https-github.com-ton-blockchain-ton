- id: GHOST-RUBY-001
  name: SQL Injection in ActiveRecord
  description: String interpolation in where()
  severity: CRITICAL
  cwe: CWE-89
  owasp: A01:2021
  languages:
  - ruby
  confidence: 0.95
  patterns:
  - type: regex
    pattern: where\s*\(\s*".*#\{|where\s*\(\s*".*\+\s*
    confidence: 0.95
  fix: 'Use parameterized queries: where(name: name)'
  tags:
  - ruby
  - rails
  - sql-injection
- id: GHOST-RUBY-002
  name: Command Injection
  description: System call with user input
  severity: CRITICAL
  cwe: CWE-78
  owasp: A01:2021
  languages:
  - ruby
  confidence: 0.92
  patterns:
  - type: regex
    pattern: system\s*\(.*params|exec\s*\(.*params|`.*#\{.*params
    confidence: 0.92
  fix: Use array form of system() with explicit args
  tags:
  - ruby
  - command-injection
- id: GHOST-RUBY-003
  name: Mass Assignment
  description: permit! or no permit in strong params
  severity: HIGH
  cwe: CWE-915
  owasp: A01:2021
  languages:
  - ruby
  confidence: 0.88
  patterns:
  - type: regex
    pattern: params\.permit!\(\)|params\.require.*\.permit\s*\(\s*\)
    confidence: 0.88
  fix: Explicitly list permitted params
  tags:
  - ruby
  - rails
  - mass-assignment
