  severity: CRITICAL
  cwe: CWE-798
  owasp: A01:2021
  languages:
  - ruby
  confidence: 0.88
  patterns:
  - type: regex
    pattern: (?:secret_key|api_key)\s*=\s*['\"][a-zA-Z0-9]{8,}
    confidence: 0.88
  fix: Use Rails credentials or ENV
  tags:
  - ruby
  - hardcoded-secret
