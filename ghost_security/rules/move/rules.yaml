- id: GHOST-MOVE-001
  name: Missing Capability Check
  description: Entry fun callable without capability
  severity: CRITICAL
  cwe: CWE-284
  owasp: A01:2021
  languages:
  - move
  confidence: 0.92
  patterns:
  - type: regex
    pattern: public\s+entry\s+fun\b(?!.*_cap\b|.*cap:)
    confidence: 0.92
  fix: Require capability object in signature
  tags:
  - move
  - capability
  - access-control
- id: GHOST-MOVE-002
