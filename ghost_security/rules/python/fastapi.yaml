- id: GHOST-FA-001
  name: FastAPI missing auth
  description: Router without auth dependency
  severity: HIGH
  cwe: CWE-306
  owasp: A03:2021
  languages:
  - python
  confidence: 0.87
  patterns:
  - type: regex
    pattern: '@(?:app|router)\.(?:get|post|put|delete)\s*\([^)]+\)(?![\s\S]{0,200}Depends\s*\([^)]*(?:auth|token|jwt|get_current))'
    confidence: 0.87
  fix: Add Depends(get_current_user)
  tags:
  - fastapi
  - auth
