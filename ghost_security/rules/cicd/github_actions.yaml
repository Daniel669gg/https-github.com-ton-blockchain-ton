- id: GHOST-CI-INJECT-001
  name: Script injection via env
  description: GitHub Actions script injection
  severity: CRITICAL
  cwe: CWE-78
  owasp: A05:2021
  languages:
  - yaml
  - github-actions
  confidence: 0.92
  patterns:
  - type: regex
    pattern: \$\{\{\s*(?:github\.event\.|env\.|inputs\.)[^}]+\}\}
    confidence: 0.92
  fix: Use env vars instead of direct expression interpolation
  tags:
  - injection
  - github-actions
