name: Ghost Security CI

on:
  push:
    branches:
      - main
      - "claude/*"
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # ── 2. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -x -q --tb=short

  # ── 3. Security scan ─────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ghost scan
        run: |
          python ghost_cli_main.py scan ghost_security/ \
            --output json \
            --min-severity HIGH > /tmp/findings.json || true

      - name: Fail on CRITICAL findings
        run: |
          python - <<'EOF'
          import json, sys
          try:
              findings = json.load(open("/tmp/findings.json"))
          except Exception:
              print("No findings file or parse error — treating as clean")
              sys.exit(0)
          # Support both list and {"findings": [...]} shapes
          if isinstance(findings, dict):
              items = findings.get("findings", [])
          else:
              items = findings
          criticals = [f for f in items if str(f.get("severity", "")).upper() == "CRITICAL"]
          if criticals:
              print(f"::error::Found {len(criticals)} CRITICAL finding(s):")
              for f in criticals:
                  print(f"  - {f.get('id', 'N/A')} {f.get('desc', f.get('description', ''))}")
              sys.exit(1)
          print(f"No CRITICAL findings. Total HIGH+: {len(items)}")
          EOF

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-findings
          path: /tmp/findings.json

  # ── 4. Docker build ──────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ghost-security:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
