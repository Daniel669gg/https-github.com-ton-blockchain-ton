[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tythanai"
version = "6.5.0"
description = "TythanAI — AI-native AppSec platform. SAST · SCA · Secrets · EPSS · TON/Web3 · K8s · Multi-LLM"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "TythanAI Team"}]
keywords = ["security", "appsec", "sast", "sca", "vulnerability", "TON", "blockchain", "k8s", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "semgrep>=1.100.0",
    "bandit>=1.7.7",
]

[project.optional-dependencies]
ai = ["openai>=1.30.0"]
memory = ["chromadb>=0.4.24"]
full = ["openai>=1.30.0", "chromadb>=0.4.24", "httpx>=0.27.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff", "mypy"]

[project.scripts]
tythanai = "cli.tythanai_cli:main"
ghost    = "cli.tythanai_cli:main"

[project.urls]
Homepage      = "https://tythanai.com"
Documentation = "https://docs.tythanai.com"
Repository    = "https://github.com/tythanai/platform"
"Bug Tracker" = "https://github.com/tythanai/platform/issues"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "archive*"]

[tool.setuptools.package-data]
"*" = ["rules/**/*.yaml", "rules/**/*.yml", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select  = ["E", "F", "W"]
ignore  = ["E501", "F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
