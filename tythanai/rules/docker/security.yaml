  - type: regex
    pattern: ^ENV\s+[A-Z_]*(?:PASSWORD|SECRET|TOKEN|KEY|CREDENTIAL)[A-Z_]*\s*=
    confidence: 0.93
  fix: Use Docker secrets or build args
  tags:
  - docker
  - secret
- id: GHOST-DK-SECRETS-002
  name: Secret in ARG
