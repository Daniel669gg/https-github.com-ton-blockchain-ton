- id: GHOST-DK-ROOT-001
  name: Container as root
  description: Running as root in Dockerfile
  severity: HIGH
  cwe: CWE-250
  owasp: A05:2021
  languages:
  - dockerfile
  confidence: 0.92
  patterns:
  - type: regex
    pattern: ^USER\s+root
    confidence: 0.92
  fix: Add non-root USER instruction
  tags:
  - docker
  - root
- id: GHOST-DK-ROOT-002
  name: No USER instruction
  description: No USER specified
  severity: HIGH
  cwe: CWE-250
  owasp: A05:2021
  languages:
  - dockerfile
  confidence: 0.8
  patterns:
  - type: regex
    pattern: ^FROM\s+[^\n]+(?![\s\S]*^USER\s+(?!root))
    confidence: 0.8
  fix: Add USER non-root-user before CMD/ENTRYPOINT
  tags:
  - docker
  - root
