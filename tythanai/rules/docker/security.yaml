- id: GHOST-DK-LAYER-001
  name: Secrets in layer
  description: Secret set then deleted (still in layer)
  severity: CRITICAL
  cwe: CWE-312
  owasp: A05:2021
  languages:
  - dockerfile
  confidence: 0.85
  patterns:
  - type: regex
    pattern: (?:ENV|ARG).*(?:PASSWORD|SECRET|TOKEN|KEY)[\s\S]{0,200}^RUN.*rm.*\k
    confidence: 0.85
  fix: Use multi-stage builds; secrets persist in layers
  tags:
  - docker
  - secret
