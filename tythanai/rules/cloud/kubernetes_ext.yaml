- id: GHOST-K8S2-001
  name: Helm chart secret plain
  description: Secret in Helm values.yaml
  severity: CRITICAL
  cwe: CWE-312
  owasp: A05:2021
  languages:
  - yaml
  - kubernetes
  confidence: 0.85
  patterns:
  - type: regex
    pattern: (?:password|secret|token|key)\s*:\s*[A-Za-z0-9+/=_\-]{8,}(?!\s*\{\{)
    confidence: 0.85
  fix: Use SealedSecrets or external-secrets
  tags:
  - helm
  - secret
- id: GHOST-K8S2-002
  name: Helm no resource limits
  description: Helm chart without resource limits
  severity: HIGH
  cwe: CWE-400
  owasp: A05:2021
  languages:
  - yaml
  - kubernetes
  confidence: 0.85
  patterns:
  - type: regex
    pattern: replicaCount:\s*\d+(?![\s\S]{0,500}resources:\s*\n\s*limits:)
    confidence: 0.85
  fix: Set resources.limits in chart
  tags:
  - helm
  - resources
