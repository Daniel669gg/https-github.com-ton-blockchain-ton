- id: GHOST-AWS2-001
  name: IAM over-permissive trust
  description: IAM trust policy with *
  severity: CRITICAL
  cwe: CWE-285
  owasp: A05:2021
  languages:
  - terraform
  - hcl
  confidence: 0.85
  patterns:
  - type: regex
    pattern: '"Principal"\s*:\s*"\*"'
    confidence: 0.85
  fix: Restrict principal to specific account/role
  tags:
  - aws
  - iam
