- id: GHOST-SOL-ACC-001
  name: Missing Signer Check
  description: Account not verified as signer
  severity: CRITICAL
  cwe: CWE-284
  owasp: A01:2021
  languages:
  - rust
  confidence: 0.93
  patterns:
  - type: regex
    pattern: (?<!require!.*is_signer)ctx\.accounts\.\w+\.key\b
    confidence: 0.93
  fix: Add require!(ctx.accounts.authority.is_signer)
  tags:
  - solana
  - signer
  - access-control
