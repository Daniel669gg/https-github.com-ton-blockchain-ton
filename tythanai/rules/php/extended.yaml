- id: GHOST-PHP2-001
  name: PHP open_basedir bypass
  description: open_basedir not set
  severity: HIGH
  cwe: CWE-22
  owasp: A03:2021
  languages:
  - php
  confidence: 0.87
  patterns:
  - type: regex
    pattern: open_basedir\s*=\s*(?!\/)
    confidence: 0.87
  fix: Set open_basedir to restrict file access
  tags:
  - php
  - config
- id: GHOST-PHP2-002
