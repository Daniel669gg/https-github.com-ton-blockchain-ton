- id: GHOST-CI2-001
  name: GitLab CI script inject
  description: GitLab CI with user-controlled script
  severity: CRITICAL
  cwe: CWE-78
  owasp: A05:2021
  languages:
  - yaml
  - github-actions
  - jenkins
  confidence: 0.87
  patterns:
  - type: regex
    pattern: script:\s*\n\s*-\s*\$(?:CI_COMMIT_MESSAGE|CI_MERGE_REQUEST_TITLE)
    confidence: 0.87
  fix: Quote and sanitize CI variables
  tags:
  - gitlab-ci
  - injection
- id: GHOST-CI2-002
  name: Jenkins Groovy eval
  description: Jenkins pipeline with eval
  severity: CRITICAL
  cwe: CWE-94
  owasp: A05:2021
  languages:
  - yaml
  - github-actions
  - jenkins
  confidence: 0.87
  patterns:
  - type: regex
    pattern: evaluate\s*\([^)]*(?:params\.|env\.)
    confidence: 0.87
  fix: Never evaluate pipeline params as code
  tags:
  - jenkins
  - eval
- id: GHOST-CI2-003
  name: CircleCI secret expose
