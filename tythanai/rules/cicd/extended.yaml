  cwe: CWE-312
  owasp: A05:2021
  languages:
  - yaml
  - github-actions
  - jenkins
  confidence: 0.87
  patterns:
  - type: regex
    pattern: echo\s+\$\w*(?:SECRET|TOKEN|KEY|PASSWORD)\w*
    confidence: 0.87
