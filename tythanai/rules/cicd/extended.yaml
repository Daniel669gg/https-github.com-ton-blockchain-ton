- id: GHOST-CI2-007
  name: GHA pull_request_target
  description: pwn request pattern
  severity: CRITICAL
  cwe: CWE-78
  owasp: A05:2021
  languages:
  - yaml
  - github-actions
  - jenkins
  confidence: 0.87
  patterns:
  - type: regex
    pattern: on:\s*pull_request_target[\s\S]{0,500}actions/checkout[\s\S]{0,200}ref:\s*\$\{\{\s*github\.event\.pull_request\.head\.sha
    confidence: 0.87
  fix: Pin checkout ref to PR merge commit
