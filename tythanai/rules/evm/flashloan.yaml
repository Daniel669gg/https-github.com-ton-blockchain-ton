- id: GHOST-EVM-FL-001
  name: Spot Price After Flash Loan
  description: Price queried in same block as flash loan
  severity: CRITICAL
  cwe: CWE-20
  owasp: A01:2021
  languages:
  - solidity
  confidence: 0.92
  patterns:
  - type: regex
    pattern: flashLoan|executeOperation.*getPrice
    confidence: 0.92
  fix: Use TWAP; never spot price in flash loan callbacks
  tags:
  - flashloan
  - oracle
  - price
- id: GHOST-EVM-FL-002
