- id: GHOST-JS-ADV-009
  name: SQL Injection via Template Literal
  description: SQL built with template literal
  severity: CRITICAL
  cwe: CWE-89
  owasp: A01:2021
  languages:
  - javascript
  confidence: 0.95
  patterns:
  - type: regex
    pattern: SELECT.*\$\{|INSERT.*\$\{|UPDATE.*\$\{
    confidence: 0.95
  fix: Use parameterized queries
  tags:
  - javascript
  - sql-injection
  - template-literal
- id: GHOST-JS-ADV-010
  name: Path Traversal in fs
