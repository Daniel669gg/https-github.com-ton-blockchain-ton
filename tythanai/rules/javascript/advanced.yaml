  owasp: A01:2021
  languages:
  - javascript
  confidence: 0.9
  patterns:
  - type: regex
    pattern: fs\.readFile\s*\(\s*(?:req\.|request\.)
    confidence: 0.9
  fix: Sanitize and validate file paths
  tags:
  - javascript
  - path-traversal
  - nodejs
