- id: GHOST-PY-DJ-001
  name: Django extra() injection
  description: Django .extra() with user input
  severity: CRITICAL
  cwe: CWE-89
  owasp: A05:2021
  languages:
  - python
  confidence: 0.87
  patterns:
  - type: regex
    pattern: \.extra\s*\([^)]*(?:where|select|tables|order_by)\s*=.*\+
    confidence: 0.87
  fix: Use ORM methods instead of .extra()
  tags:
  - sql
  - django
